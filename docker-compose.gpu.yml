# Opt-in NVIDIA GPU acceleration, only on CUDA-capable Linux hosts.
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  worker:
    build:
      context: ./backend
      args:
        OCR_ENGINE: gpu
    environment:
      OCR_DEVICE: gpu:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
