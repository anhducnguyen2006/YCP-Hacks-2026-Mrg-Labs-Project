services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mrg_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-mrg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrg_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mrg} -d ${POSTGRES_DB:-mrg_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mrg}:${POSTGRES_PASSWORD:-mrg_local_dev}@postgres:5432/${POSTGRES_DB:-mrg_scanner}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGINS: http://localhost:5173,http://frontend:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      GEMINI_INPUT_MODE: ${GEMINI_INPUT_MODE:-frames}
      GEMINI_VIDEO_FPS: ${GEMINI_VIDEO_FPS:-}
      GEMINI_FRAME_FPS: ${GEMINI_FRAME_FPS:-6}
      GEMINI_MAX_FRAMES: ${GEMINI_MAX_FRAMES:-12}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_MAX_RETRY_WAIT_SECONDS: ${GEMINI_MAX_RETRY_WAIT_SECONDS:-30}
      MEDIA_ROOT: /data/media
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-15}
      MAX_VIDEO_SIZE_BYTES: ${MAX_VIDEO_SIZE_BYTES:-52428800}
      PROCESSING_STALE_SECONDS: ${PROCESSING_STALE_SECONDS:-300}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/data/media
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mrg}:${POSTGRES_PASSWORD:-mrg_local_dev}@postgres:5432/${POSTGRES_DB:-mrg_scanner}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      GEMINI_INPUT_MODE: ${GEMINI_INPUT_MODE:-frames}
      GEMINI_VIDEO_FPS: ${GEMINI_VIDEO_FPS:-}
      GEMINI_FRAME_FPS: ${GEMINI_FRAME_FPS:-6}
      GEMINI_MAX_FRAMES: ${GEMINI_MAX_FRAMES:-12}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_MAX_RETRY_WAIT_SECONDS: ${GEMINI_MAX_RETRY_WAIT_SECONDS:-30}
      MEDIA_ROOT: /data/media
      PROCESSING_STALE_SECONDS: ${PROCESSING_STALE_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/data/media
    command: rq worker --url redis://redis:6379/0 mrg-scanner

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  media_data:
