[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrg-sample-scanner-api"
version = "0.2.0"
description = "FastAPI + RQ frame-based sample label scanner"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "rq>=2,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.18",
  "google-genai>=3.0,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "paddlepaddle>=3.2,<4",
  "paddleocr>=3.2,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI intentionally uses Depends(...) and File(...) as endpoint defaults.
# Restrict this exception to the API routes, not the rest of the codebase.
"app/main.py" = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
